# Active routing profile (TRIAL.md). baseline = the roles block below, unchanged.
# To trial: set to trial-lean. To roll back: set back to baseline. Nothing else changes.
profile: baseline

# Role to model routing (HARNESS.md section 3). Retrospectives may propose changes here;
# every change is logged and measured. Fable is deliberately absent: manual break-glass only.
roles:
  orchestrator: claude-sonnet-5-5      # Stage 0 manual Loom; mechanical work, rotated often
  architect: claude-opus-5-5
  test_author: claude-opus-5-5
  implementer: claude-sonnet-5-5
  escalation: claude-opus-5-5
  reviewer: claude-opus-5-5
  scribe: claude-haiku-5-5
  retrospective: claude-opus-5-5
  security_reviewer: claude-opus-5-5   # HARNESS.md section 6b, all read-only
  qa_lead: claude-opus-5-5
  cso: claude-opus-5-5
  auditor: claude-opus-5-5
  visual_qa: claude-opus-5-5

# A task whose changed files match these globs gets that specialist review in addition to Gate 2.
specialist_reviews:
  security: ["pipeline/publish/**", "pipeline/ingest/**", "**/auth*", ".github/workflows/**",
             "pipeline/render/compose.py", "pipeline/script/gemini.py", "pipeline/script/batch.py",
             "pipeline/script/validate.py"]
  visual_qa: ["pipeline/render/**", "pipeline/visuals/**", "assets/**"]

limits:
  max_parallel_implementers: 2      # HARNESS.md principle 6
  default_max_turns: 40
  review_rounds_before_escalation: 2

rotation:                            # HARNESS.md section 7a
  rotate_context_pct: 60             # task sessions
  orchestrator_rotate_context_pct: 50
  context_window_tokens: 200000      # verify with /context; a smaller value only rotates earlier
  rotations_before_split: 3          # then the Architect splits the task (section 6)

escalation:                          # HARNESS.md section 6
  same_failures_attempts: 3
  total_attempts: 5
  lock_violations: 2
  opus_attempts_before_blocked: 2

# Routing trials (TRIAL.md). A profile lists only the roles it changes; every other role uses `roles`.
# Reviews keep the baseline model for contracts/tests tasks and for diffs touching security paths.
profiles:
  trial-lean:
    roles:
      reviewer: claude-sonnet-5-5      # Gate 2 for ordinary implementation tasks
      visual_qa: claude-sonnet-5-5     # rendered-frame checks
    shadow_review_every: 3             # about 1 in 3 downgraded reviews also runs on Opus, for comparison
