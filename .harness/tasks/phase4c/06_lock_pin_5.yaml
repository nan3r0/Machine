id: p4c-lock-pin-5
title: Put num2words back to 0.5.6 and stop Dependabot bumping num2words, docopt and srsly
depends_on: []
role: implementer
notes: |
  Before launch: mark p4c-lock-pin-4 done in .harness/status.yaml. This task now owns
  tests/test_lock_consistency.py (conftest gives a test file to the last task that lists it).
  Bug A: PR #158 (num2words 0.5.6 to 0.5.14, commit f73b9d2) was merged to main. num2words 0.5.14's
  wheel METADATA has `Requires-Dist: docopt>=0.6.2`; docopt ships only an sdist and no lock pins it, so
  `pip install --require-hashes -r requirements-render.txt` fails: "In --require-hashes mode, all
  requirements must have their versions pinned with ==: docopt>=0.6.2 from num2words" (render.yml run
  45306110415). num2words 0.5.6 has no Requires-Dist, so restoring it removes docopt entirely.
  test_num2words_stays_at_0_5_6_unless_docopt_is_pinned fails on main today and is the regression test.
  Bug B: PR #169 (srsly 2.5.6 to 3.0.1) is open, not merged, and breaks spacy 3.8.18's
  `Requires-Dist: srsly<3.0.0,>=2.5.3`. The lock is still right; the test now has the srsly row in
  CONSTRAINTS and srsly in CAPPED, so test_dependabot_never_takes_capped_pins_past_a_major fails until
  srsly is ignored. Do not merge PR #169; the orchestrator closes it.
  - requirements-render.txt: replace the whole num2words==0.5.14 block (the pin line and both hash
    lines) with the 0.5.6 block, the pin line and its one hash line from
    `git show f73b9d2^:requirements-render.txt` (lines 114-115). Copy the lines with a script from git,
    never type, invent or download a hash. Nothing else in the file changes.
  - .github/dependabot.yml, pip entry: add bare ignores `- dependency-name: num2words`,
    `- dependency-name: docopt` and `- dependency-name: srsly` (no update-types, so every version is
    ignored). Keep every existing ignore and the pydantic group.
  - Install proof on Linux: CI's Gate 1 does not install the locks (task p4c-ci-lock-resolve adds
    that). Hand off as `partial`, "awaiting install proof"; the orchestrator asks the owner to dispatch
    render.yml on main after merge. If that run fails on another package, report which; do not guess.
paths_allowed:
  - requirements-render.txt
  - .github/dependabot.yml
tests:
  - tests/test_lock_consistency.py
acceptance: tests/test_lock_consistency.py::test_acceptance
context_files:
  - requirements-render.txt
  - .github/dependabot.yml
  - tests/test_lock_consistency.py
  - lessons.md
max_turns: 15
