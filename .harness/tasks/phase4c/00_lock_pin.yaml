id: p4c-lock-pin
title: Put pydantic-core back in step with pydantic in requirements-generate.txt and stop Dependabot bumping it alone
depends_on: []
role: implementer
notes: |
  Bug: Dependabot bumped pydantic-core alone in requirements-generate.txt (commit ba7bbd0) to 2.50.5,
  but pydantic 2.14.3 requires exactly pydantic-core 2.50.4 (its wheel METADATA). So
  `pip install --require-hashes -r requirements-generate.txt` fails with ResolutionImpossible:
  weekly-scripts run 45232745791 failed at "Install light requirements", and the daily_publish
  upload job installs the same file. requirements-render.txt already pins 2.50.4 and works.
  - requirements-generate.txt: set pydantic-core to 2.50.4 and replace its hash lines with exactly
    the --hash lines pydantic-core 2.50.4 has in requirements-render.txt. Copy them, do not invent
    or download new ones. Nothing else in the file changes.
  - .github/dependabot.yml: in the pip entry, add an `ignore` entry with
    `dependency-name: pydantic-core`. pydantic decides its pydantic-core version; a bump comes in
    with a pydantic bump and a lock regenerate, never on its own. Nothing else changes.
  - Install proof on Linux: CI's Gate 1 does not install requirements-generate.txt. After push,
    hand off as `partial`, "awaiting install proof"; the orchestrator asks the owner for a
    weekly-scripts dispatch on the task branch (or the next run after merge).
  - The lessons.md entry (a bump of one package in a hashed lock must keep the lock consistent)
    is owed by the orchestrator at close-out, not by this task.
  No security trigger in .harness/config.yaml matches these paths; the orchestrator may ask for
  the security review by hand, since this is a supply-chain lock.
paths_allowed:
  - requirements-generate.txt
  - .github/dependabot.yml
tests:
  - tests/test_lock_consistency.py
acceptance: tests/test_lock_consistency.py::test_acceptance
context_files:
  - requirements-generate.txt
  - requirements-render.txt
  - .github/dependabot.yml
  - tests/test_lock_consistency.py
  - lessons.md
max_turns: 15
