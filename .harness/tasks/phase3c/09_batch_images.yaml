id: p3c-batch-images
title: PR body shows each scene's image prompt and overlay; exact check on overlay values
depends_on: [p3c-validate-images]
role: implementer
notes: |
  batch.py only. .harness/handoffs/p3c-plan.md, "Script writer".
  - `_script_section` shows each scene's image prompt (or "same picture"), camera and overlay as
    same-line code spans (`_code`). A script with fewer than IMAGES_PER_VIDEO[0] prompts (valid, since
    validate enforces only the maximum) gets a Flag.
  - After any rewrite, `exact.unsupported` checks the overlay's label and value against the scene's
    cited facts. A miss becomes a Flag and the overlay is dropped (p3-plan D4, kept). No Gemini
    call and no stop; the p4d quota guard is untouched.
  - The PR body stays under PR_BODY_MAX_CHARS at every cap (locked arithmetic test).
  The existing batch tests must keep passing (not listed under `tests`).
paths_allowed:
  - pipeline/script/batch.py
tests:
  - tests/script/test_batch_visuals.py
acceptance: tests/script/test_batch_visuals.py::test_acceptance
context_files:
  - .harness/handoffs/p3c-plan.md
  - pipeline/script/batch.py
  - pipeline/factcheck/exact.py
  - tests/script/test_batch_visuals.py
  - lessons.md
max_turns: 25
