id: p3c-writer-images
title: Script writer emits per-scene image prompts, camera and an optional overlay in the same Gemini call
depends_on: [p3c-validate-images]
role: implementer
notes: |
  generate.py only. .harness/handoffs/p3c-plan.md, "Script writer".
  - Still exactly one generate_json call per write_script. WRITER_MAX_CALLS_PER_BATCH and the p4d
    quota guard (GeminiQuotaError, GEMINI_MAX_CONSECUTIVE_ERRORS) are untouched.
  - Writer schema: flat per-scene fields `image` (string; empty keeps the previous painting),
    `camera` (enum), `overlay_kind` (enum with "none"), `overlay_label` and `overlay_value`. No anyOf.
  - Prompt: a `_VISUAL_RULES` constant. Pictures follow the story's places (the whale example in
    the plan); describe places, objects, light and weather; never a named or real person, never
    text or signs; people only as distant silhouettes; repeat the subject's words across scenes.
    The style prefix is added by flux_cf, never written by Gemini.
  - A broken visual falls back in code (drop the overlay, keep the previous picture), with no
    GenerateError and no extra call. Too few images keeps the script; batch flags it.
  - rewrite_line keeps the scene's visual.
  The existing generate and prompt_data tests must keep passing (not listed under `tests`).
paths_allowed:
  - pipeline/script/generate.py
tests:
  - tests/script/test_generate_visuals.py
acceptance: tests/script/test_generate_visuals.py::test_acceptance
context_files:
  - .harness/handoffs/p3c-plan.md
  - pipeline/script/generate.py
  - pipeline/script/validate.py
  - tests/script/test_generate_visuals.py
  - tests/script/gemini_fakes.py
max_turns: 25
