id: p3-contracts
title: Phase 3 slice 1 contracts - visual constants, visuals stubs, locked tests, demo fixture
depends_on: [p3-spike]
role: test_author
notes: |
  Starts after the owner answers p3-plan D1 to D7 in .harness/handoffs/p3-plan.md (not Phase 2's
  D1 to D8 in PRD.md). The plan's "Scene
  visual types", "How the script writer changes" and "Architect decisions" sections are the spec;
  record any deviation in the handoff. Goes to main on `plan/p3-contracts` before any implementer
  (lessons.md 2026-11-25): task YAMLs are already there, this adds stubs and locked tests.
  - pipeline/constants.py: per-template palettes (background, accent, text) for chart, map,
    steps, story; the visual panel band (from p3-spike); CAPTION_POS_Y (p3-plan D2, inside the locked
    range SAFE_TOP_PX + 2*FONT .. SAFE_BOTTOM_PX - 2*FONT); caps ON_SCREEN_TEXT_MAX_CHARS,
    VISUAL_ITEMS_MAX, VISUAL_LABEL_MAX_CHARS, VISUAL_VALUE_MAX_CHARS and a per-script screen-text
    total chosen so 7 scripts at every cap stay under PR_BODY_MAX_CHARS (extend the arithmetic in
    the locked batch test); animation timings. No schema.py change (plan: no schema_version bump).
  - Stubs with docstring contracts, raising NotImplementedError: pipeline/visuals/__init__.py,
    ass_kit.py, cards.py, charts.py, router.py. router: `scene_spans(script, timings)` and
    `build_scenes_ass(script, timings) -> str`. compose: document the new keyword-only arguments
    (scenes path, background colour) in the test files only; compose.py is p3-compose's.
  - Locked tests, new files, one owner each: tests/script/test_validate_visuals.py,
    tests/visuals/test_ass_kit.py, test_cards.py, test_charts.py, test_router.py (incl. a
    hypothesis test that spans are ordered, cover the hook to the loop line and never overlap),
    tests/render/test_compose_scenes.py (incl. a heavy render with a scenes file),
    tests/test_render_one_visuals.py (heavy acceptance: both demo scripts render and pass QA),
    tests/script/test_generate_visuals.py, tests/script/test_batch_visuals.py. Expected values
    from the spec or literals, never from the code under test (lessons.md 2026-11-16).
  - Existing locked tests kept true before and after: tests/script/test_generate.py:112 (drop
    the `data == {}` assertion, keep the rest), the fake compose in tests/test_render_one.py:51
    (accept the new keyword arguments). Run pytest without LOOM_TASK: main stays green.
  - queue/approved/sample-65s.json: migrate its steps data to the `items` shape (a timeline).
    First confirm `git ls-tree -r origin/ledger` holds no record for it; if it does, stop and
    use a fixture copy instead. tests/fixtures/scripts/demo-chart.json: a second valid 65 s
    script (template chart, counter and bars) from an existing source's facts, for M1.
  - Add every new test path to [tool.mutmut] also_copy if it reads a new root folder.
  - Update workflow.md: `### Phase 3 status` table (exact heading), module order, criterion map.
  - Update PRD.md: section 4 Phase 3 requirements R19 to R22 (plan handoff, Docs section), the
    section 3 current-phase line, and the owner's p3-plan D1 to D10 answers in section 7.
paths_allowed:
  - pipeline/constants.py
  - pipeline/visuals/__init__.py
  - pipeline/visuals/ass_kit.py
  - pipeline/visuals/cards.py
  - pipeline/visuals/charts.py
  - pipeline/visuals/router.py
  - queue/approved/sample-65s.json
  - tests/**
  - pyproject.toml
  - workflow.md
  - PRD.md
  - .harness/locks.yaml
tests:
  - tests/test_render_constants_visuals.py
acceptance: tests/test_render_constants_visuals.py::test_acceptance
context_files:
  - .harness/handoffs/p3-plan.md
  - .harness/handoffs/p3-spike.md
  - PLAN.md#6
  - PRD.md
  - spec.md
  - docs/threat-model.md
  - pipeline/schema.py
  - pipeline/constants.py
  - pipeline/render/compose.py
  - pipeline/render/captions_ass.py
  - pipeline/script/validate.py
  - pipeline/script/generate.py
  - pipeline/script/batch.py
  - tests/script/test_batch.py
  - tests/test_render_one.py
  - lessons.md
max_turns: 40
