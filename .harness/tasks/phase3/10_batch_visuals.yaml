id: p3-batch-visuals
title: PR body shows on-screen text and visual items; exact check on screen numbers
depends_on: [p3-validate-visuals]
role: implementer
notes: |
  batch.py only. `_script_section` adds, per scene, the on_screen_text and each visual item as
  same-line code spans (`_code`), never plain Markdown. A new check runs `exact.unsupported` on
  each scene's on_screen_text, labels and values against that scene's cited facts, after any
  rewrite. A miss is a Flag naming the scene and the missing items and, per p3-plan D4,
  replaces that scene's visual with {"type": "story", "data": {}} and clears on_screen_text if
  it holds the miss. No Gemini call and no stop; the run never halts on it. The PR body stays
  under PR_BODY_MAX_CHARS at every cap (locked arithmetic test). The existing batch tests must
  keep passing (not listed under `tests`, so they keep running on main).
paths_allowed:
  - pipeline/script/batch.py
tests:
  - tests/script/test_batch_visuals.py
acceptance: tests/script/test_batch_visuals.py::test_acceptance
context_files:
  - .harness/handoffs/p3-plan.md
  - pipeline/script/batch.py
  - pipeline/factcheck/exact.py
  - tests/script/test_batch_visuals.py
  - lessons.md
max_turns: 25
