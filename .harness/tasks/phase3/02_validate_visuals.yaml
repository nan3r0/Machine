id: p3-validate-visuals
title: Validate visual data per type and cap on-screen text
depends_on: [p3-contracts]
role: implementer
notes: |
  `validate.problems` gains the per-type rules in .harness/handoffs/p3-plan.md ("Scene visual
  types"): data is {} or {"items": [...]} with 1 to VISUAL_ITEMS_MAX items of {label, value};
  chart with 2+ items needs plain-number values; steps values all empty or all set; map exactly
  one item; story only {}. Every label and value runs through the existing published-field text
  check (URLs, control and look-alike characters, non-ASCII digits). Caps from constants only.
  Messages name the scene and field, like the existing ones. Phase 2 scripts with {} stay valid.
  The existing validate tests and tests/test_queue_scripts.py must keep passing. They are not
  listed under `tests`: tests/conftest.py gives a file to the last task YAML (sorted path) that
  lists it, so listing them here would skip them on main until this task is done.
paths_allowed:
  - pipeline/script/validate.py
tests:
  - tests/script/test_validate_visuals.py
acceptance: tests/script/test_validate_visuals.py::test_acceptance
context_files:
  - .harness/handoffs/p3-plan.md
  - pipeline/script/validate.py
  - pipeline/constants.py
  - tests/script/test_validate_visuals.py
  - lessons.md
max_turns: 25
