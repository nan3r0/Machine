id: p3-writer-visuals
title: Script writer asks for a visual per scene in the same Gemini call
depends_on: [p3-validate-visuals]
role: implementer
notes: |
  generate.py only. Writer schema: each scene adds flat `visual_type` (enum chart, map, steps,
  story) and `items` (array of {label, value} strings); no anyOf. Prompt: a `_VISUAL_RULES`
  constant as in .harness/handoffs/p3-plan.md, carried in the existing prompt; facts stay in the
  data block. Still exactly one generate_json call per write_script. A scene whose visual breaks
  a validate rule becomes {"type": "story", "data": {}} in code (no GenerateError, no extra
  call); every other rule is unchanged. rewrite_line leaves the visual as it is. Update the
  module and write_script docstrings. The existing generate and prompt_data tests must keep
  passing (not listed under `tests`, so they keep running on main).
paths_allowed:
  - pipeline/script/generate.py
tests:
  - tests/script/test_generate_visuals.py
acceptance: tests/script/test_generate_visuals.py::test_acceptance
context_files:
  - .harness/handoffs/p3-plan.md
  - pipeline/script/generate.py
  - pipeline/script/validate.py
  - tests/script/test_generate_visuals.py
  - tests/script/gemini_fakes.py
max_turns: 25
