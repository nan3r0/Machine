id: p3-compose
title: Compose background, scenes layer and captions; captions to the lower half
depends_on: [p3-background]
role: implementer
notes: |
  compose.build_ffmpeg_args and compose.compose gain keyword-only arguments for the background
  (from background.py) and a scenes .ass path, each defaulting to today's behaviour. With them
  the filtergraph runs background, then `subtitles=<scenes>`, then `subtitles=<captions>`; every
  path goes through the existing escaping helper with the same fontsdir. A missing input raises
  ComposeError.
  captions_ass.py: POS_Y comes from CAPTION_POS_Y (p3-plan D2), and nothing else in it changes.
  Argument lists only. The existing compose and captions tests must keep passing (not listed
  under `tests`).
paths_allowed:
  - pipeline/render/compose.py
  - pipeline/render/captions_ass.py
tests:
  - tests/render/test_compose_layers.py
acceptance: tests/render/test_compose_layers.py::test_acceptance
context_files:
  - .harness/handoffs/p3-plan.md
  - .harness/handoffs/p3-spike.md
  - pipeline/render/compose.py
  - pipeline/render/background.py
  - pipeline/render/captions_ass.py
  - pipeline/constants.py
  - tests/render/test_compose_layers.py
  - lessons.md
max_turns: 30
