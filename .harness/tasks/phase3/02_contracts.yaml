id: p3-contracts
title: Phase 3 slice 1 contracts - constants, art models, visuals stubs, locked tests, fixtures
depends_on: [p3-character-art]
role: test_author
notes: |
  Starts only after the owner approves the items in .harness/handoffs/p3-plan.md under "What the
  owner approves before p3-contracts" (p3-plan D ids, not Phase 2's D1 to D8 in PRD.md). The
  plan is the spec; record any deviation. Goes to main on `plan/p3-contracts` before any
  implementer (lessons.md 2026-11-25).
  - pipeline/constants.py, using the numbers p3-spike proposes:
    - set ids (D13), poses (D12), camera moves, and the default set per template;
    - drift speed per depth, push-in rate, scene fade, blink and bob timings;
    - character placement, the data-card panel, CAPTION_POS_Y (D2, inside the locked range);
    - caps on items, labels and values, plus a per-script total so 7 scripts at every cap
      stay under PR_BODY_MAX_CHARS (extend the arithmetic in the locked batch test).
    No schema.py change.
  - pipeline/visuals/art.py (contract): the Pydantic models for assets/character/host.yaml and
    assets/sets/<id>.yaml, plus loaders. Validate assets/character/host.yaml now.
  - Stubs raising NotImplementedError, with docstring contracts:
    - pipeline/visuals/__init__.py, ass_kit.py, character.py, cards.py, charts.py, router.py;
    - pipeline/render/background.py (draw each set layer to a PNG once; build the FFmpeg
      arguments for parallax, push-in and fades, argument lists only).
    compose's new keyword-only arguments are described in its test file only.
  - Locked tests, new files with one owner each:
    - tests/script/test_validate_visuals.py
    - tests/visuals/test_ass_kit.py, test_character.py (mouth follows word timings, blinks,
      every pose, same anchor in every scene), test_cards.py, test_charts.py, test_router.py
      (a hypothesis test that spans are ordered, cover hook to loop line and never overlap;
      {} falls back to the defaults)
    - tests/visuals/test_sets_art.py (every set id has a valid asset; owner p3-sets-art)
    - tests/render/test_background.py, tests/render/test_compose_layers.py (heavy cases inside)
    - tests/test_render_one_visuals.py (heavy acceptance: both demo scripts render and pass QA,
      and write golden frames plus an 8-frame strip across one scene change)
    - tests/script/test_generate_visuals.py, tests/script/test_batch_visuals.py
    - tests/test_render_constants_visuals.py (this task's own)
    Expected values come from the spec or literals, never from the code under test.
  - Existing locked tests stay true before and after the change:
    - tests/script/test_generate.py:112: drop the `data == {}` assertion.
    - tests/test_render_one.py:51: the fake compose accepts the new keyword arguments.
    Run pytest without LOOM_TASK: main stays green.
  - queue/approved/sample-65s.json: give its scenes sets and poses, and a timeline data scene.
    First confirm `git ls-tree -r origin/ledger` holds no record for it; if it does, stop and
    use a fixture copy. tests/fixtures/scripts/demo-data.json: a second valid 65 s script
    (another template, with counter, bars and place card scenes) for M1.
  - Add any new root folder the tests read to [tool.mutmut] also_copy.
  - workflow.md: a `### Phase 3 status` table (exact heading), the module order and the
    criterion map.
  - PRD.md: section 4 R19 to R22, section 3 phase line, section 7 the owner's p3-plan answers.
paths_allowed:
  - pipeline/constants.py
  - pipeline/visuals/__init__.py
  - pipeline/visuals/art.py
  - pipeline/visuals/ass_kit.py
  - pipeline/visuals/character.py
  - pipeline/visuals/cards.py
  - pipeline/visuals/charts.py
  - pipeline/visuals/router.py
  - pipeline/render/background.py
  - queue/approved/sample-65s.json
  - tests/**
  - pyproject.toml
  - workflow.md
  - PRD.md
  - .harness/locks.yaml
tests:
  - tests/test_render_constants_visuals.py
acceptance: tests/test_render_constants_visuals.py::test_acceptance
context_files:
  - .harness/handoffs/p3-plan.md
  - .harness/handoffs/p3-spike.md
  - .harness/handoffs/p3-character-art.md
  - assets/character/host.yaml
  - PLAN.md#6
  - PRD.md
  - spec.md
  - docs/threat-model.md
  - pipeline/schema.py
  - pipeline/constants.py
  - pipeline/render/compose.py
  - pipeline/render/captions_ass.py
  - pipeline/script/validate.py
  - pipeline/script/generate.py
  - pipeline/script/batch.py
  - tests/script/test_batch.py
  - tests/test_render_one.py
  - lessons.md
max_turns: 45
