id: p3-wiring
title: render_one writes scenes.ass and composes it with the template background (milestone M1)
depends_on: [p3-router, p3-compose, p3-validate-visuals]
role: implementer
notes: |
  After alignment, write `out_dir/scenes.ass` from `router.build_scenes_ass(script, timings)` and
  pass it and the template's background colour to compose. Steps are still called through their
  modules so tests can fake them. Exit codes unchanged. Heavy acceptance runs in CI on a draft
  PR. Then M1: the orchestrator dispatches render.yml on this branch for
  queue/approved/sample-65s.json and tests/fixtures/scripts/demo-chart.json; visual QA reviews
  both `frames` artifacts and the owner looks at them before merge. The existing render_one
  and golden-frame tests must keep passing (not listed under `tests`, so they keep running on main).
paths_allowed:
  - pipeline/render_one.py
tests:
  - tests/test_render_one_visuals.py
acceptance: tests/test_render_one_visuals.py::test_acceptance
context_files:
  - .harness/handoffs/p3-plan.md
  - pipeline/render_one.py
  - pipeline/visuals/router.py
  - pipeline/render/compose.py
  - tests/test_render_one_visuals.py
max_turns: 25
