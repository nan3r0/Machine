id: p3-cards
title: Card layouts - story title card, numbered steps, timeline, place card
depends_on: [p3-ass-kit]
role: implementer
notes: |
  One function per layout, each taking the scene's text and items, a time window and a palette,
  returning ASS event lines built with ass_kit. Story: on_screen_text words slide and fade in
  (empty text gives no events). Steps: numbered cards one at a time. Timeline: dots on a line,
  value and label pop in, staggered. Place card: pin, sonar rings, place name, optional value.
  Every event lies inside its window and the panel band; long text wraps inside it, never cut.
paths_allowed:
  - pipeline/visuals/cards.py
tests:
  - tests/visuals/test_cards.py
acceptance: tests/visuals/test_cards.py::test_acceptance
context_files:
  - .harness/handoffs/p3-plan.md
  - pipeline/visuals/cards.py
  - pipeline/visuals/ass_kit.py
  - pipeline/constants.py
  - tests/visuals/test_cards.py
max_turns: 30
