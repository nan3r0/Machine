[project]
name = "shorts-pipeline"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# Heavy packages are installed only in CI and the render workflow (requirements-heavy.txt),
# so local mypy runs must not fail on their missing imports.
[[tool.mypy.overrides]]
module = [
    "kokoro",
    "kokoro.*",
    "misaki",
    "misaki.*",
    "stable_whisper",
    "stable_whisper.*",
    "whisper",
    "whisper.*",
    "torch",
    "torch.*",
    "torchaudio",
    "torchaudio.*",
    "huggingface_hub",
    "huggingface_hub.*",
]
ignore_missing_imports = true

# soundfile is light but ships no type information.
[[tool.mypy.overrides]]
module = ["soundfile"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p pytester"
markers = [
    "heavy: needs ffmpeg, torch or Kokoro; runs only in CI (CI=true), skipped locally",
]

[tool.mutmut]
source_paths = ["pipeline/"]
tests_dir = ["tests/"]
# mutmut appends these to every pytest call it makes (clean run, stats, each mutant). The reports
# job sets CI=true, so without this every mutant would rerun the heavy renders and the job hits
# its 90-minute limit. Coverage still includes heavy tests: that pytest line runs outside mutmut.
# Code reached only by heavy tests shows as "no tests" in mutmut.txt, not as a test gap; judge
# those parts (render, voice alignment, Kokoro) from coverage.xml instead.
pytest_add_cli_args = ["-m", "not heavy"]
# Tests read these from the repo root, so mutmut must copy them into its working tree (mutants/).
# mutmut already copies tests/ and pyproject.toml. A nested file needs its folder listed, since
# mutmut copies single files without creating parent folders.
also_copy = [
    "queue/", ".harness/", "assets/", ".github/", ".claude/hooks/",
    "Makefile", "requirements.txt", "requirements-dev.txt", "requirements-heavy.txt",
    "CLAUDE.md", "workflow.md", "lessons.md",
]

[tool.coverage.run]
source = ["pipeline"]
