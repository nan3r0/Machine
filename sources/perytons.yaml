topic: "Perytons at the Parkes radio telescope"
facts:
  - id: 201
    text: "Perytons were strange radio signals picked up by the Parkes Observatory radio telescope."
    url: "https://en.wikipedia.org/wiki/Peryton_(astronomy)"
  - id: 202
    text: "The first peryton occurred in 2001 but was not discovered in the data until 2007."
    url: "https://en.wikipedia.org/wiki/Peryton_(astronomy)"
  - id: 203
    text: "Between 1998 and 2015, old data showed 46 perytons at the Parkes Observatory."
    url: "https://en.wikipedia.org/wiki/Peryton_(astronomy)"
  - id: 204
    text: "Each peryton came with radio emission at 2.5 GHz from outside the telescope's field of view."
    url: "https://en.wikipedia.org/wiki/Peryton_(astronomy)"
  - id: 205
    text: "In 2015, perytons were found to be caused by microwave oven doors opened early at the Parkes Observatory."
    url: "https://en.wikipedia.org/wiki/Peryton_(astronomy)"
  - id: 206
    text: "A peryton was produced about half the times the microwave door was opened before the timer ran out."
    url: "https://en.wikipedia.org/wiki/Peryton_(astronomy)"
  - id: 207
    text: "The finding was published in 2015 by Petroff and colleagues as Identifying the source of perytons at the Parkes radio telescope."
    url: "https://en.wikipedia.org/wiki/Peryton_(astronomy)"
