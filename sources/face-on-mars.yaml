topic: "The Face on Mars"
facts:
  - id: 1101
    text: "On 25 July 1976, the Viking 1 orbiter photographed a mesa in the Cydonia region of Mars that looked like a human face."
    url: "https://en.wikipedia.org/wiki/Cydonia_(Mars)"
  - id: 1102
    text: "The mesa is about two kilometers long."
    url: "https://en.wikipedia.org/wiki/Cydonia_(Mars)"
  - id: 1103
    text: "Viking chief scientist Gerald Soffen dismissed it as a trick of light and shadow."
    url: "https://en.wikipedia.org/wiki/Cydonia_(Mars)"
  - id: 1104
    text: "A second Viking image, taken 35 orbits later at a different sun angle, also showed the face."
    url: "https://en.wikipedia.org/wiki/Cydonia_(Mars)"
  - id: 1105
    text: "The Viking images had a resolution of about 50 meters per pixel."
    url: "https://en.wikipedia.org/wiki/Cydonia_(Mars)"
  - id: 1106
    text: "Mars Global Surveyor photographed the feature again in April 2001, and Mars Reconnaissance Orbiter did so in April 2007."
    url: "https://en.wikipedia.org/wiki/Cydonia_(Mars)"
  - id: 1107
    text: "NASA's analysis of the sharper images found a natural looking Martian hill."
    url: "https://en.wikipedia.org/wiki/Cydonia_(Mars)"
  - id: 1108
    text: "The face is accepted as an optical illusion, an example of pareidolia."
    url: "https://en.wikipedia.org/wiki/Cydonia_(Mars)"
