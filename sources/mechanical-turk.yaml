topic: "The Mechanical Turk chess machine"
facts:
  - id: 1301
    text: "The Turk was a chess-playing machine built by Wolfgang von Kempelen to impress Empress Maria Theresa."
    url: "https://en.wikipedia.org/wiki/Mechanical_Turk"
  - id: 1302
    text: "The Turk made its debut in 1770 at Schönbrunn Palace."
    url: "https://en.wikipedia.org/wiki/Mechanical_Turk"
  - id: 1303
    text: "The Turk won most of its games, including against Napoleon Bonaparte and Benjamin Franklin."
    url: "https://en.wikipedia.org/wiki/Mechanical_Turk"
  - id: 1304
    text: "The machine was toured and exhibited for 84 years as an automaton."
    url: "https://en.wikipedia.org/wiki/Mechanical_Turk"
  - id: 1305
    text: "In 1827, at a match in Baltimore, the hidden operator was seen climbing out of the cabinet, though most of the public did not believe it."
    url: "https://en.wikipedia.org/wiki/Mechanical_Turk"
  - id: 1306
    text: "In 1857, an article by the owner's son gave the first full explanation of the machine."
    url: "https://en.wikipedia.org/wiki/Mechanical_Turk"
  - id: 1307
    text: "A chess master hidden in the lower cabinet moved the pieces with levers and magnets."
    url: "https://en.wikipedia.org/wiki/Mechanical_Turk"
  - id: 1308
    text: "Each chess piece had a small, strong magnet attached to its base."
    url: "https://en.wikipedia.org/wiki/Mechanical_Turk"
