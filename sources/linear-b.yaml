topic: "The decipherment of Linear B"
facts:
  - id: 701
    text: "In April 1900, Arthur Evans's excavators at Knossos on Crete found the first large cache of Linear B tablets."
    url: "https://en.wikipedia.org/wiki/Linear_B"
  - id: 702
    text: "The earliest known examples of Linear B date to around 1450 BC."
    url: "https://en.wikipedia.org/wiki/Linear_B"
  - id: 703
    text: "Linear B has around 87 syllabic signs and over 100 ideographic signs."
    url: "https://en.wikipedia.org/wiki/Linear_B"
  - id: 704
    text: "Alice Kober built grids linking similar symbols in groups of three."
    url: "https://en.wikipedia.org/wiki/Linear_B"
  - id: 705
    text: "Linear B was deciphered in 1952 by English architect and self-taught linguist Michael Ventris."
    url: "https://en.wikipedia.org/wiki/Linear_B"
  - id: 706
    text: "John Chadwick, a lecturer in Ancient Greek, worked with Ventris on the decipherment."
    url: "https://en.wikipedia.org/wiki/Linear_B"
  - id: 707
    text: "The script turned out to write an early form of Greek."
    url: "https://en.wikipedia.org/wiki/Linear_B"
