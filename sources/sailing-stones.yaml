topic: "The sailing stones of Death Valley"
facts:
  - id: 101
    text: "Rocks leave long tracks across Racetrack Playa, a dry lakebed in Death Valley National Park, California."
    url: "https://en.wikipedia.org/wiki/Sailing_stones"
  - id: 102
    text: "The tracks are often up to 100 meters long and 8 to 30 centimeters wide."
    url: "https://en.wikipedia.org/wiki/Sailing_stones"
  - id: 103
    text: "Explanations for the moving rocks ranged from the supernatural to the complex."
    url: "https://en.wikipedia.org/wiki/Sailing_stones"
  - id: 104
    text: "Most geologists suspected strong winds pushing the rocks across wet mud."
    url: "https://en.wikipedia.org/wiki/Sailing_stones"
  - id: 105
    text: "A team led by Norris tracked the rocks with GPS and time-lapse cameras and published the results in PLOS ONE in 2014."
    url: "https://en.wikipedia.org/wiki/Sailing_stones"
  - id: 106
    text: "On 20 December 2013, the team recorded more than 60 rocks moving at once."
    url: "https://en.wikipedia.org/wiki/Sailing_stones"
  - id: 107
    text: "Thin ice panels, a few millimeters thick, formed on a shallow winter pond and broke up in light winds."
    url: "https://en.wikipedia.org/wiki/Sailing_stones"
  - id: 108
    text: "The drifting ice shoved the rocks at up to 5 meters per minute, and some traveled up to 224 meters."
    url: "https://en.wikipedia.org/wiki/Sailing_stones"
  - id: 109
    text: "The researchers identified the cause of the moving stones as ice shove, not strong winds or thick ice."
    url: "https://en.wikipedia.org/wiki/Sailing_stones"
