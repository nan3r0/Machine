topic: "Piltdown Man"
facts:
  - id: 401
    text: "In 1912, Charles Dawson reported finding part of a human-like skull in gravel beds near Piltdown, East Sussex."
    url: "https://en.wikipedia.org/wiki/Piltdown_Man"
  - id: 402
    text: "The find was presented as a missing link between early apes and humans and named Eoanthropus dawsoni."
    url: "https://en.wikipedia.org/wiki/Piltdown_Man"
  - id: 403
    text: "Piltdown Man was accepted for about 41 years before it was exposed as a forgery."
    url: "https://en.wikipedia.org/wiki/Piltdown_Man"
  - id: 404
    text: "In 1953, scientists at the British Museum used fluorine absorption dating to test the bones."
    url: "https://en.wikipedia.org/wiki/Piltdown_Man"
  - id: 405
    text: "The tests showed that the jaw and canine tooth were deliberate fakes."
    url: "https://en.wikipedia.org/wiki/Piltdown_Man"
  - id: 406
    text: "The fossil combined a medieval human skull, a 500-year-old orangutan lower jaw and fossil chimpanzee teeth."
    url: "https://en.wikipedia.org/wiki/Piltdown_Man"
  - id: 407
    text: "The bones had been stained with an iron solution and chromic acid to make them look old."
    url: "https://en.wikipedia.org/wiki/Piltdown_Man"
  - id: 408
    text: "Under a microscope, the teeth showed file marks."
    url: "https://en.wikipedia.org/wiki/Piltdown_Man"
  - id: 409
    text: "A 2016 study found the teeth from both sites came from the same orangutan, pointing to the work of one person."
    url: "https://en.wikipedia.org/wiki/Piltdown_Man"
