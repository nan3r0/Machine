topic: "The Cottingley Fairies photographs"
facts:
  - id: 501
    text: "The Cottingley Fairies are a series of five photographs taken by cousins Elsie Wright and Frances Griffiths."
    url: "https://en.wikipedia.org/wiki/Cottingley_Fairies"
  - id: 502
    text: "In 1917, when the first two photographs were taken, Elsie was 16 years old and Frances was 9."
    url: "https://en.wikipedia.org/wiki/Cottingley_Fairies"
  - id: 503
    text: "Arthur Conan Doyle was commissioned by The Strand Magazine to write an article on fairies for its Christmas issue."
    url: "https://en.wikipedia.org/wiki/Cottingley_Fairies"
  - id: 504
    text: "His article in the December 1920 issue of The Strand included prints of the 1917 photographs."
    url: "https://en.wikipedia.org/wiki/Cottingley_Fairies"
  - id: 505
    text: "Decades later, the cousins admitted the photographs were faked."
    url: "https://en.wikipedia.org/wiki/Cottingley_Fairies"
  - id: 506
    text: "The fairies were cardboard cutouts copied from a popular children's book, the Princess Mary's Gift Book."
    url: "https://en.wikipedia.org/wiki/Cottingley_Fairies"
  - id: 507
    text: "The cousins held the cardboard figures up with hatpins."
    url: "https://en.wikipedia.org/wiki/Cottingley_Fairies"
  - id: 508
    text: "Frances maintained that the fifth and final photograph was genuine."
    url: "https://en.wikipedia.org/wiki/Cottingley_Fairies"
