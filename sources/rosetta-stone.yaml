topic: "How the Rosetta Stone unlocked hieroglyphs"
facts:
  - id: 801
    text: "Egyptian hieroglyphs had not been understood since shortly before the fall of the Roman Empire."
    url: "https://en.wikipedia.org/wiki/Rosetta_Stone"
  - id: 802
    text: "The Rosetta Stone was found in July 1799 near Rosetta by French army officer Pierre-François Bouchard."
    url: "https://en.wikipedia.org/wiki/Rosetta_Stone"
  - id: 803
    text: "It carries a decree issued in 196 BC on behalf of King Ptolemy V."
    url: "https://en.wikipedia.org/wiki/Rosetta_Stone"
  - id: 804
    text: "The same decree appears three times, in hieroglyphic, Demotic and Greek scripts."
    url: "https://en.wikipedia.org/wiki/Rosetta_Stone"
  - id: 805
    text: "Thomas Young found the name Ptolemy in the hieroglyphic text and noted as many as 80 similarities with the Demotic text."
    url: "https://en.wikipedia.org/wiki/Rosetta_Stone"
  - id: 806
    text: "Jean-François Champollion announced his decipherment in 1822 in a letter to Bon-Joseph Dacier."
    url: "https://en.wikipedia.org/wiki/Rosetta_Stone"
  - id: 807
    text: "The stone has been on public display at the British Museum almost continuously since 1802."
    url: "https://en.wikipedia.org/wiki/Rosetta_Stone"
