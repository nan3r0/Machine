topic: "Blood Falls in Antarctica"
facts:
  - id: 301
    text: "Blood Falls is a red plume of saltwater flowing from the tongue of Taylor Glacier onto the frozen West Lake Bonney in Antarctica."
    url: "https://en.wikipedia.org/wiki/Blood_Falls"
  - id: 302
    text: "It lies in Taylor Valley, in the McMurdo Dry Valleys of East Antarctica."
    url: "https://en.wikipedia.org/wiki/Blood_Falls"
  - id: 303
    text: "The red deposit was found in 1911 by the Australian geologist Thomas Griffith Taylor."
    url: "https://en.wikipedia.org/wiki/Blood_Falls"
  - id: 304
    text: "Early Antarctic explorers thought the red color came from red algae."
    url: "https://en.wikipedia.org/wiki/Blood_Falls"
  - id: 305
    text: "It was later proven that the red color comes from iron oxides."
    url: "https://en.wikipedia.org/wiki/Blood_Falls"
  - id: 306
    text: "The iron comes from ancient seawater trapped under the glacier, concentrated into a salty brine."
    url: "https://en.wikipedia.org/wiki/Blood_Falls"
  - id: 307
    text: "When the brine reaches the surface, its iron reacts with oxygen in the air and forms red iron oxides."
    url: "https://en.wikipedia.org/wiki/Blood_Falls"
