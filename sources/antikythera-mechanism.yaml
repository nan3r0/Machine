topic: "The Antikythera mechanism"
facts:
  - id: 601
    text: "The device was among wreckage retrieved from a shipwreck off the Greek island of Antikythera in 1901."
    url: "https://en.wikipedia.org/wiki/Antikythera_mechanism"
  - id: 602
    text: "The shipwreck has been dated to approximately 70 to 60 BC."
    url: "https://en.wikipedia.org/wiki/Antikythera_mechanism"
  - id: 603
    text: "Estimates for when the mechanism was built range from about 205 to 87 BC."
    url: "https://en.wikipedia.org/wiki/Antikythera_mechanism"
  - id: 604
    text: "Science historian Derek de Solla Price became interested in the mechanism in 1951."
    url: "https://en.wikipedia.org/wiki/Antikythera_mechanism"
  - id: 605
    text: "Researchers used X-ray tomography and high resolution scanning to image inside the crusted fragments."
    url: "https://en.wikipedia.org/wiki/Antikythera_mechanism"
  - id: 606
    text: "The scans suggest the mechanism had 35 meshing bronze gears, 30 of which are still visible."
    url: "https://en.wikipedia.org/wiki/Antikythera_mechanism"
  - id: 607
    text: "It is the oldest known example of an analogue computer, used to model the heavens."
    url: "https://en.wikipedia.org/wiki/Antikythera_mechanism"
  - id: 608
    text: "A dial on its back calculated the timing of athletic games such as the ancient Olympic Games."
    url: "https://en.wikipedia.org/wiki/Antikythera_mechanism"
  - id: 609
    text: "In 2021, researchers at University College London published a new reconstruction of the entire mechanism."
    url: "https://en.wikipedia.org/wiki/Antikythera_mechanism"
