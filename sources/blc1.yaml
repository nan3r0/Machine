topic: "BLC1, the radio signal from the direction of Proxima Centauri"
facts:
  - id: 1001
    text: "BLC1 was a candidate SETI radio signal detected during observations in April and May 2019."
    url: "https://en.wikipedia.org/wiki/BLC1"
  - id: 1002
    text: "BLC1 stands for Breakthrough Listen Candidate 1."
    url: "https://en.wikipedia.org/wiki/BLC1"
  - id: 1003
    text: "It was picked up by the Parkes Radio Telescope in Australia during observations of Proxima Centauri."
    url: "https://en.wikipedia.org/wiki/BLC1"
  - id: 1004
    text: "The signal came from the direction of Proxima Centauri, the closest star to the Solar System."
    url: "https://en.wikipedia.org/wiki/BLC1"
  - id: 1005
    text: "The signal had a frequency of 982.002 MHz."
    url: "https://en.wikipedia.org/wiki/BLC1"
  - id: 1006
    text: "BLC1 was first reported to the public on 18 December 2020."
    url: "https://en.wikipedia.org/wiki/BLC1"
  - id: 1007
    text: "On 25 October 2021, researchers concluded the signal was unlikely to be a technosignature."
    url: "https://en.wikipedia.org/wiki/BLC1"
  - id: 1008
    text: "BLC1 closely resembled previously detected radio interference from Earth."
    url: "https://en.wikipedia.org/wiki/BLC1"
