version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: thinc
        update-types: ["version-update:semver-major"]
      - dependency-name: curated-transformers
      - dependency-name: curated-tokenizers
      - dependency-name: spacy-curated-transformers
    groups:
      pydantic:
        patterns:
          - pydantic
          - pydantic-core
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
