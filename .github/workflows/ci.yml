name: ci

on:
  # Task and docs branches get CI from their PR (a draft is enough), so a push there no longer
  # runs the check twice. scripts/** stays on push: Workflow A opens that PR with GITHUB_TOKEN,
  # whose pull_request runs wait for approval, and the owner's edits on it must still get CI.
  push:
    branches: [main, "scripts/**"]
  pull_request:
  workflow_dispatch:

# One group per PR, where a newer update cancels the older run. Every other run gets its own
# group: GitHub cancels a pending run in a shared group even without cancel-in-progress, so a
# main push must never replace a queued reports dispatch.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Upgrade build tooling
        run: python -m pip install -q "setuptools>=84.1.0"

      # The checker script comes from the base ref, so a branch cannot weaken the script itself
      # (it can still edit this workflow; the owner's PR diff review covers that). Only the
      # contracts task, which adds the checker, may fall back to its own copy.
      - name: Scope check (task branches only)
        run: |
          base="${BASE_REF:-main}"
          git rev-parse --verify --quiet "origin/$base" > /dev/null || { echo "origin/$base not found" >&2; exit 1; }
          python -m pip install -q pyyaml==6.0.3
          checker="$RUNNER_TEMP/scope_check.py"
          if git cat-file -e "origin/$base:tests/scope_check.py"; then
            git show "origin/$base:tests/scope_check.py" > "$checker"
          elif [ "$BRANCH" = "task/p1-contracts" ]; then
            echo "base has no scope checker yet; p1-contracts adds it, so using the branch copy"
            cp tests/scope_check.py "$checker"
          else
            echo "base origin/$base has no tests/scope_check.py" >&2
            exit 1
          fi
          python "$checker" "$BRANCH" "origin/$base"

      # Runs here as well as in make check so docs drift fails in seconds, before the installs.
      # The branch copy is fine: the scope check above already blocks implementer edits to tests/.
      - name: Docs check
        run: python tests/docs_check.py

      - name: Set LOOM_TASK from the branch name
        run: |
          case "$BRANCH" in
            task/*)
              id="${BRANCH#task/}"
              if [[ ! "$id" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
                echo "invalid task id in branch name" >&2
                exit 1
              fi
              echo "LOOM_TASK=$id" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg espeak-ng

      - name: Install torch from the PyTorch CPU index only
        run: |
          grep -E '^torch(audio)?==' requirements-heavy.txt > "$RUNNER_TEMP/torch.txt"
          python -m pip install -q --no-deps --index-url https://download.pytorch.org/whl/cpu -r "$RUNNER_TEMP/torch.txt"

      - name: Install Python packages
        run: python -m pip install -q -r requirements.txt -r requirements-dev.txt -r requirements-heavy.txt

      - name: Install gitleaks and actionlint (pinned, checksum verified)
        run: |
          mkdir -p "$HOME/.local/bin" /tmp/tools
          cd /tmp/tools
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          mv gitleaks actionlint "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/whisper
            .cache/models
          key: models-${{ hashFiles('requirements-heavy.txt', 'pipeline/constants.py') }}

      - name: Gate 1
        run: make check

      - name: Upload frames for visual QA
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frames
          path: out/frames/
          if-no-files-found: ignore
          retention-days: 7

  # make check installs the plain pin lists, never the hashed locks, so a Dependabot bump that pip
  # cannot resolve passed it and broke only a live workflow. This job resolves each lock the way
  # render.yml, daily_publish.yml and weekly_scripts.yml install it, each in a fresh venv so no
  # unhashed install from another step can satisfy a pin. Torch is installed for real because the
  # render lock does not pin it and --require-hashes rejects an unpinned requirement.
  lock-resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Resolve the render locks
        run: |
          python -m venv "$RUNNER_TEMP/render"
          "$RUNNER_TEMP/render/bin/python" -m pip install -q --no-deps --require-hashes --index-url https://download.pytorch.org/whl/cpu -r requirements-render-torch.txt
          "$RUNNER_TEMP/render/bin/python" -m pip install --dry-run --require-hashes -r requirements-render.txt

      - name: Resolve the generate lock
        run: |
          python -m venv "$RUNNER_TEMP/generate"
          "$RUNNER_TEMP/generate/bin/python" -m pip install --dry-run --require-hashes -r requirements-generate.txt

  reports:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg espeak-ng
          grep -E '^torch(audio)?==' requirements-heavy.txt > "$RUNNER_TEMP/torch.txt"
          python -m pip install -q --no-deps --index-url https://download.pytorch.org/whl/cpu -r "$RUNNER_TEMP/torch.txt"
          python -m pip install -q -r requirements.txt -r requirements-dev.txt -r requirements-heavy.txt

      # One step per report, each run unless cancelled: a finding in one (a failing test, a
      # vulnerable package) still fails the job but no longer skips the other reports or the upload.
      - name: Coverage report
        run: |
          mkdir -p out/reports
          pytest -q --cov=pipeline --cov-report=xml:out/reports/coverage.xml --cov-report=term > out/reports/coverage.txt

      - name: Mutation report
        if: ${{ !cancelled() }}
        run: |
          mutmut run
          mutmut results > out/reports/mutmut.txt

      - name: Licence report
        if: ${{ !cancelled() }}
        run: pip-licenses --format=markdown --with-urls > out/reports/licenses.md

      # Audits the whole installed env (dev tools and runner packages included) with no ignores,
      # unlike Gate 1, so the Auditor sees every advisory, accepted ones too.
      - name: Vulnerability report
        if: ${{ !cancelled() }}
        run: pip-audit --format json --output out/reports/pip-audit.json

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase-reports
          path: out/reports/
          if-no-files-found: error
          retention-days: 14
