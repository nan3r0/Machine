name: weekly-audit

# A red run is the alert (failure emails, runbook). Read-only token and no secret. The pull_request
# paths check a dependency bump on its own PR and give the Linux proof for this workflow.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "requirements*.txt"
      - "Makefile"
      - ".github/workflows/weekly_audit.yml"

# A scheduled run gets its own group: GitHub cancels a pending run in a shared group, and a
# cancelled run is not red.
concurrency:
  group: weekly-audit-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pip-audit
        run: python -m pip install -q pip-audit==2.10.1

      # The command and its accepted ignores live in the Makefile, shared with Gate 1.
      - name: Vulnerability audit
        run: make audit

  licences:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Upgrade build tooling
        run: python -m pip install -q "setuptools>=84.1.0"

      - name: Install torch from the PyTorch CPU index only
        run: |
          grep -E '^torch(audio)?==' requirements-heavy.txt > "$RUNNER_TEMP/torch.txt"
          python -m pip install -q --no-deps --index-url https://download.pytorch.org/whl/cpu -r "$RUNNER_TEMP/torch.txt"

      # The runtime set only: no dev tools and no pip-audit, so their licences do not count.
      - name: Install runtime packages
        run: python -m pip install -q -r requirements.txt -r requirements-heavy.txt

      - name: Install pip-licenses
        run: python -m pip install -q pip-licenses==5.5.5

      # phonemizer-fork 3.3.2 (GPLv3+, pulled in by misaki[en]) was accepted at p1-audit: GPL duties
      # apply to distribution, and no GPL file is tracked or distributed. Pinned to the version, so
      # a bump is checked again.
      - name: Licence report
        run: pip-licenses --format=json --ignore-packages phonemizer-fork:3.3.2 --output-file "$RUNNER_TEMP/licenses.json"

      # pip-licenses --fail-on matches substrings, so "GPL-3.0" would also hit "LGPL-3.0-only".
      # This rule fails any GNU GPL or AGPL licence and passes LGPL and UNKNOWN.
      - name: Licence rule
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys

          path = os.path.join(os.environ["RUNNER_TEMP"], "licenses.json")
          with open(path, encoding="utf-8") as report:
              rows = json.load(report)
          rule = r"(?i)\bA?GPL|GNU (Affero )?General Public"
          bad = [f"{r['Name']} {r['Version']}: {r['License']}" for r in rows if re.search(rule, r["License"])]
          print("\n".join(bad) or f"{len(rows)} packages, no GPL or AGPL")
          sys.exit(1 if bad else 0)
          PY
